# fly.toml app configuration file generated for lead-scraper-rrhtda on 2026-08-04T18:14:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lead-scraper-rrhtda'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LEAD_HISTORY_PATH = '/data/lead_history.db'
  COMPANY_CATALOG_PATH = '/data/company_catalog.db'
  OPENAI_EMBEDDING_MODEL = 'text-embedding-3-small'

[mounts]
  source = 'lead_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
