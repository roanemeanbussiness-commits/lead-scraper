# fly.toml for lead-scraper-rrhtda - now the 8-Thon Intelligence Copy Studio

app = 'lead-scraper-rrhtda'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHAT_STORE_PATH = '/data/copy_studio.db'
  # OPENAI_MODEL = 'gpt-4.1'                  # override chat model here
  # OPENAI_SEARCH_MODEL = 'gpt-4o-search-preview'

[mounts]
  source = 'lead_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Chat streams are live HTTP connections, so autostop is safe again:
  # an in-flight response counts as load, and an idle studio can sleep.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
