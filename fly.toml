# fly.toml app configuration file generated for lead-scraper-rrhtda on 2026-08-04T18:14:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lead-scraper-rrhtda'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LEAD_HISTORY_PATH = '/data/lead_history.db'
  COMPANY_CATALOG_PATH = '/data/company_catalog.db'
  JOB_OUTPUT_PATH = '/data/jobs'
  OCEAN_STORE_PATH = '/data/ocean_leads.db'
  OCEAN_WEBHOOK_BASE_URL = 'https://lead-scraper-rrhtda.fly.dev'
  OCEAN_REVEAL_WAIT_SECONDS = '120'

[mounts]
  source = 'lead_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Searches run as background threads. Fly autostops on concurrent load, not
  # request count, so status polling does not keep the machine alive and a
  # running search was being SIGINT'd mid-flight. Keep one machine up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
